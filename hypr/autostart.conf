exec-once = /home/victor/.config/hypr/scripts/restore_aoc_transform.sh

# Wallpaper daemon: Arch a remplacé swww par awww
exec-once = bash -lc 'if command -v awww-daemon >/dev/null 2>&1 && command -v awww >/dev/null 2>&1; then \
  awww-daemon & \
  for i in {1..100}; do awww query >/dev/null 2>&1 && break; sleep 0.1; done; \
  awww img --transition-type none --transition-duration 0 "$HOME/Pictures/wallpapers/kawase_hasui_kawarahata_gunma_1955.jpg"; \
elif command -v swww-daemon >/dev/null 2>&1 && command -v swww >/dev/null 2>&1; then \
  swww-daemon & \
  for i in {1..100}; do swww query >/dev/null 2>&1 && break; sleep 0.1; done; \
  swww img --transition-type none --transition-duration 0 "$HOME/Pictures/wallpapers/kawase_hasui_kawarahata_gunma_1955.jpg"; \
fi'

exec-once = waybar
exec-once = mako
exec-once = rm -rf ~/Trash/*
exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE
# Apps réseau avec attente réelle (sans magic sleep)
# Attendre que NetworkManager dise "online" (10s max), puis lancer Spotify
# exec-once = [workspace 3 silent] flatpak run com.spotify.Client

exec-once = [workspace 4 silent] signal-desktop

# Audio après que pactl réponde
exec-once = bash -lc 'for i in {1..20}; do pactl info >/dev/null 2>&1 && break; sleep 0.5; done; pactl set-sink-volume "$(pactl get-default-sink)" 30%'
