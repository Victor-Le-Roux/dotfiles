font_family         BlexMono Nerd Font
bold_font           auto
italic_font         auto
bold_italic_font    auto
font_size           15
shell               /usr/bin/fish
enable_audio_bell   no
allow_remote_control no

window_padding_width      2 5
confirm_os_window_close   0
window_border_width       1pt
active_border_color       #1a6e7d
inactive_border_color     #b0cdd2

include ~/.config/kitty/theme.conf

detect_urls  yes
url_color    #1a6e7d
url_style    curly

scrollback_lines        1500
wheel_scroll_multiplier 10.0

background_opacity      1.0
dim_opacity             1.0
text_fg_override_threshold 6.0 ratio
hide_window_decorations yes
sync_to_monitor         yes

input_delay             1
cursor_shape            beam
cursor_beam_thickness   4.5
cursor_blink_interval   0


map ctrl+shift+f send_text all clear\n cd `cdinteractive`\n
