 # Hyprland >= 0.53 window rules

windowrule = suppress_event maximize, match:class .*
windowrule = no_anim on, match:class ^(thorium-browser)$
windowrule = no_blur on, match:class ^(thorium-browser)$
windowrule = no_shadow on, match:class ^(thorium-browser)$

# Rofi: remove border on rofi window only (avoid global border_size toggle)
windowrule = border_size 0, match:class ^(Rofi)$

# Gemini PWA
windowrule = float 1, match:title ^(.*Gemini.*)$
windowrule = size 1200 800, match:title ^(.*Gemini.*)$
windowrule = center 1, match:title ^(.*Gemini.*)$
windowrule = workspace special:gemini, match:title ^(.*Gemini.*)$
