animations {
    enabled = true

    # E-ink refresh curves (pure linear, snappy)
    bezier = eink, 0.0, 0.0, 1.0, 1.0
    
    # Use popin 100% to disable movement/scaling, relying entirely on the fade opacity
    animation = windows, 1, 2, eink, popin 100%
    animation = windowsIn, 1, 2, eink, popin 100%
    animation = windowsOut, 1, 2, eink, popin 100%
    animation = windowsMove, 0, 0, eink
    
    animation = border, 1, 2, eink
    
    # Global fade settings
    animation = fade, 1, 2, eink
    animation = fadeIn, 1, 2, eink
    animation = fadeOut, 1, 2, eink
    
    animation = layers, 1, 2, eink
    animation = layersIn, 1, 2, eink, fade
    animation = layersOut, 1, 2, eink, fade
    
    animation = workspaces, 1, 2.5, eink, fade
    animation = workspacesIn, 1, 2.5, eink, fade
    animation = workspacesOut, 1, 2.5, eink, fade
}
